<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Digital Business Fit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f2e8;--card:#fff;--navy:#14213d;--ink:#26324a;--mute:#5a6277;--line:#e3dac6;--pri:#14213d;--pri2:#edf0f7;--warn:#f4edda;--wl:#d9c9a0;--sand:#efe7d3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;max-width:820px;margin:auto}
.brand{font:700 1.1rem Georgia,"Times New Roman",serif;color:var(--navy)}main{max-width:820px;margin:auto;padding:0 20px 48px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-weight:700}
h1{font-size:2rem;line-height:1.2;margin:.3em 0}h2{font-size:1.5rem;line-height:1.3;margin:.2em 0 .5em}h3{font-size:1.08rem;line-height:1.35;margin:1.1em 0 .3em}.card>h3:first-child{margin-top:.2em}
p{margin:.45em 0}.mute{color:var(--mute);font-size:.93rem}
.bar{height:5px;background:var(--line);border-radius:9px;margin:6px 0 22px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0}.card.hl{border:2px solid var(--navy)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin:10px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.on{border:2px solid var(--navy);background:var(--pri2);padding:14px 15px}

.btn.g{background:transparent;color:var(--navy);border:1px solid #b9b3a3}.btn.g:hover:not(:disabled){background:var(--sand)}.btn.s{padding:7px 14px;font-size:.9rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.tag{display:inline-block;font-size:.8rem;background:var(--pri2);color:var(--navy);border-radius:20px;padding:2px 11px;font-weight:600}
.note{background:var(--warn);border:1px solid var(--wl);border-radius:10px;padding:11px 14px;font-size:.92rem;margin:14px 0}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row .n{flex:1;font-size:.95rem}.m{flex:0 0 38%;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.m i{display:block;height:100%;background:var(--navy)}.sc{font-weight:700;min-width:46px;text-align:right;color:var(--navy)}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:.93rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.steps{display:flex;flex-direction:column;gap:8px}.st{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}.st>b{background:var(--navy);color:#fff;border-radius:50%;min-width:24px;height:24px;text-align:center;font-size:.8rem;line-height:24px;margin-top:1px}
.seq{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.seq span{background:var(--pri2);color:var(--navy);border-radius:20px;padding:3px 11px;font-size:.82rem;font-weight:600}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.chk:last-of-type{border-bottom:0}.chk input{margin-top:4px;width:18px;height:18px;flex:0 0 18px;accent-color:var(--navy)}
.ln{display:block;margin-top:5px;font-size:.93rem;line-height:1.5}
.tog{display:flex;gap:8px;margin:10px 0}.tog .btn{flex:1}
.three{display:grid;gap:12px}@media(min-width:620px){.three.c3{grid-template-columns:repeat(3,1fr)}}
.big{display:block;text-align:left;width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer}.big:hover{border-color:var(--navy)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ex{background:var(--sand);border-color:#d9cdae}
.flows{display:grid;gap:20px;margin:16px 0}@media(min-width:720px){.flows{grid-template-columns:1fr 1fr;gap:22px;align-items:start}}
.flow{border-radius:12px;overflow:hidden;background:var(--card)}.flow.today{border:1px solid #cfc5ab}.flow.future{border:2px solid var(--navy)}
.fh{padding:12px 16px}.fh b{display:block;font-size:.86rem;font-weight:600}.fh h3{margin:2px 0 0;font-size:1.12rem;color:inherit}
.today .fh{background:var(--sand);color:var(--navy)}.future .fh{background:var(--navy);color:#fff}
.fl{list-style:none;margin:0;padding:18px 16px 16px;display:flex;flex-direction:column;gap:26px;counter-reset:s}
.fs{position:relative;counter-increment:s;padding:11px 12px 11px 46px;border-radius:10px;font-size:.95rem;line-height:1.4}
.fs::before{content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:.78rem;font-weight:700}
.fs:not(:last-child)::after{content:"\2193";position:absolute;left:0;right:0;top:100%;height:26px;line-height:26px;text-align:center;font-size:1.15rem;font-weight:700;color:var(--navy)}
.today .fs{background:var(--bg);border:1px dashed #c4b998}.today .fs::before{background:#e1d7bb;color:var(--navy)}.today .fs:not(:last-child)::after{color:#8f8872}
.future .fs{background:#fff;border:1px solid #b8c0d4}.future .fs::before{background:var(--navy);color:#fff}
.future .fs.chg{background:var(--pri2);border:1px solid var(--navy);border-left:5px solid var(--navy)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const clamp=n=>Math.max(1,Math.min(5,n));
const opScore=o=>(o.F+o.T+o.B+o.D)/4;                                   // equal weights
const fitScore=t=>t.imp*.40+t.ease*.25+t.wf*.20+t.staff*.15;           // 40/25/20/15
const f2=n=>(Math.round(n*100+1e-9)/100).toFixed(2);
const WEIGHTS=[['imp',40],['ease',25],['wf',20],['staff',15]];

/* ===== Predefined data ===== */
const Q=(q,help,...o)=>({q,help,o:o.map(x=>({t:x[0],a:x[1]||{},req:x[2]}))});
const J={
m:{name:'Marketing',blurb:'Find new customers and keep enquiries organised.',
 src:'Documented scenario: N Stone Chemicals owner interview (Marketing PDF). The first answer on each screen matches the documented owner answer; other answers are alternatives you can try.',
 crit:'New customer reach',def:'acq',
 qs:[
 Q('Where do most new customers or enquiries come from?','Think about the last few months.',['The store and people we already know, plus WhatsApp, website and phone'],['Almost only people we already know',{reach:1}],['A steady mix of many sources, online and offline',{acq:-2,reach:-2}]),
 Q('What do you note down when someone enquires?','',['Name, number and product; sometimes quantity, price and delivery'],['Only a name and number',{follow:1}],['Full details, every time',{follow:-1}]),
 Q('Where is enquiry information kept?','',['Wherever it arrived: WhatsApp, calls, the store or the website'],['Together in one sheet or system',{track:-1,follow:-1}],['Mostly in people\'s memory',{track:1,follow:1}]),
 Q('Do staff enter the same customer details more than once?','',['Sometimes, for example when a WhatsApp enquiry becomes an order'],['Rarely or never'],['Often']),
 Q('What happens between an enquiry and a purchase?','',['We suggest a product, give the price and answer questions; the customer orders by store, website, WhatsApp or phone'],['We send a quotation and keep track of it',{follow:-1}],['Many enquiries simply go quiet',{follow:1}]),
 Q('If a customer does not buy straight away, what then?','',['We give details and price, and they come back when ready'],['We call them back on a set schedule',{follow:-2,outreach:-1}],['We usually lose track of them',{follow:1}]),
 Q('How do you stay in touch with existing customers?','',['We call or WhatsApp regular customers; no regular updates to everyone'],['Regular updates go to all customers',{outreach:-2}],['Only when they contact us first',{outreach:1}]),
 Q('Do you know which source brings new customers?','',['Only when it comes up in conversation'],['Yes, we record it for every new customer',{track:-2}],['No idea at all',{track:1}]),
 Q('What is hardest in attracting customers and following up?','',['Getting new customers consistently; marketing is occasional'],['Following up on enquiries',{follow:1,acq:-1}],['Keeping existing customers active',{outreach:1,acq:-1}]),
 Q('Which improvement would help most?','',['More new customers, especially contractors, builders, architects and tile installers'],['Better follow-up with enquiries',{follow:1,acq:-1}],['Test something with as little spending as possible',{},'lowcost'])],
 opps:[
 {id:'acq',n:'Inconsistent customer acquisition',F:5,T:3,B:5,D:4,goal:'Create an additional, manageable channel for attracting new business enquiries.',why:'New customers mostly arrive through existing relationships, and marketing is occasional.'},
 {id:'reach',n:'Limited reach beyond existing networks',F:4,T:3,B:5,D:4,goal:'Reach buyers outside your current network.',why:'Contractors, builders, architects and installers outside your circle are hard to reach.'},
 {id:'exec',n:'Inconsistent marketing execution',F:4,T:3,B:4,D:4,goal:'Make marketing regular instead of occasional.',why:'Promotion happens now and then, for example festival posts.'},
 {id:'outreach',n:'Limited proactive customer outreach',F:4,T:3,B:4,D:4,goal:'Contact existing customers regularly.',why:'Regular customers are not sent updates on a regular basis.'},
 {id:'follow',n:'Unstructured enquiry follow-up',F:3,T:3,B:3,D:4,goal:'Follow up enquiries in a set way.',why:'There is no fixed routine for contacting people who enquired but did not buy.'},
 {id:'track',n:'Lack of acquisition-source tracking',F:3,T:2,B:3,D:4,goal:'Record where each new customer comes from.',why:'Sources are only known when mentioned in conversation.'}],
 tools:[
 {n:'IndiaMART',imp:{acq:5,reach:5,exec:4},ease:4,wf:4,staff:4,cost:'free',what:'A business-to-business marketplace where suppliers list products and buyers send enquiries.',why:'Rated strongest for reaching business buyers while staying manageable for a small team.',limit:'A recommendation to test suitability, not a guarantee of customers or sales. Features of a free listing must be confirmed when registering.'},
 {n:'TradeIndia',imp:{acq:4,reach:4,exec:3},ease:4,wf:4,staff:4,cost:'unknown',what:'Another business-to-business marketplace for listing products.',why:'Similar ease and fit to IndiaMART, with slightly lower expected reach.',limit:'Reach for your product categories should be checked before relying on it.'},
 {n:'Google Ads',imp:{acq:5,reach:5,exec:4},ease:2,wf:3,staff:2,cost:'paid',what:'Paid adverts shown when people search on Google.',why:'High potential reach, but rated harder to run and more demanding for a small team.',limit:'Needs ongoing campaign set-up and advertising spend; harder to start with little spending.'},
 {n:'WhatsApp Business (already in use)',imp:{follow:3,outreach:4,track:2},ease:5,wf:5,staff:5,cost:'existing',fam:1,what:'The WhatsApp Business channel you already use with customers.',why:'Nothing new to learn, so it is easy to start. It is rated lower for follow-up dates and source tracking, which need a separate record.',limit:'Check which WhatsApp Business features you can use for regular messages, and any messaging rules, before relying on it for outreach.'},

 {n:'Zoho CRM',imp:{follow:5,outreach:4,track:5},ease:3,wf:3,staff:3,cost:'unknown',what:'A customer-relationship tool for recording enquiries, follow-up dates and outcomes.',why:'Rated highest for structured follow-up and source tracking, but harder to set up and keep running than a sheet.',limit:'Check current plans, user limits and any WhatsApp connection before relying on it. May be more set-up than a small team needs at first.'}],
 before:['Reach customers: new customers mainly come through existing relationships and channels.','Promote products: marketing is occasional.','Receive enquiries: store, WhatsApp Business, website and phone.','Track results: sources are not recorded systematically.'],

 costT:'Start with a basic listing, if available',costI:['Option 1 · Basic listing: indicative starting cost ₹0. IndiaMART advertises free supplier registration and basic listings; confirm which features are included.','Option 2 · Paid visibility: one published price is ₹35,000 for a year excluding GST (Mini Dynamic Catalog). It is not a quotation for your business. At an illustrative 18% GST it would be ₹41,300. Confirm the current quote and taxes with IndiaMART.','Judge value by comparing the extra cost with gross profit from orders that came through the platform, plus staff time spent on enquiries.'],
 pilot:[['Relevant enquiries','Enquiries from buyers who really want what you sell, in the quantities you sell.','Keep a simple list during the trial. Next to each enquiry write Yes or No for “is this a real, relevant buyer?”.','Many enquiries mean little if most are not real buyers. This shows whether the channel reaches the right people.'],['Enquiries that become orders','How many of the relevant enquiries ended in a quotation or an order.','On the same list, note whether a quotation or order followed. At day 30, count the orders and compare with the number of relevant enquiries. Note any still open.','Orders, not enquiries, are what the business lives on. Business-to-business sales can be slow, so open enquiries are worth noting separately.'],['Staff time spent following up','How much time staff spend checking, answering and following up these enquiries.','Ask the person responsible to note roughly how many minutes a day this takes, and add it up each week.','Even good enquiries are not worth it if answering them is more than a small team can keep up.'],['Spending compared with business earned','Money spent on the channel compared with money earned from the orders it brought.','Write down anything you pay (it may be nothing in a free trial). At day 30, note the value of orders that came through the channel. Compare the two in plain terms, including staff time.','It shows whether the channel pays for itself before you spend more on it.']],

 snap:'Before you start, look back over the last month. Write down roughly how many enquiries came in from all channels, how many were relevant, how many became orders, and how much staff time they took. A rough, honest estimate is fine. The new channel starts at zero, so you are checking what it adds.',
 steps:[['Create your business listing','Register with accurate details and check which features are free.'],['Add your products','Clear photos, names, specifications, sizes and contact information.'],['Assign enquiry checking','One existing employee checks enquiries at an agreed time, if workload allows.'],['Respond to buyers','Confirm product, quantity, specifications, price and delivery.'],['Record the outcome','Note source, product, whether a quotation was given and whether an order followed. Keep customer data secure.']],
 link:['Open IndiaMART','https://www.indiamart.com/'],
 fu:{before:['Receive enquiries: store, WhatsApp Business, website and phone.','Give details and price: the customer may come back when ready.','No fixed follow-up: nobody is contacted on a schedule.','Track results: sources are not recorded systematically.'],
 after:['Record each enquiry in one place with product, source and date.','Set a next follow-up date for anyone who has not bought yet.','Contact people on that date and note what they said.','Record the outcome: ordered, still interested or closed.'],
 costT:'Start with what you already use',costI:['No current prices are shown here. WhatsApp Business and Excel are already used in the business, so a first trial may need no new spending.','If you consider a paid tool, ask for a written quote and check plan fees, number of users, set-up effort and any integration costs.','Judge value by comparing extra cost with gross profit from orders that came back after a follow-up, plus staff time spent.'],
 pilot:[['Relevant enquiries','Genuine enquiries from people who might buy, written in the shared record with a next follow-up date.','Count the rows in your shared record that have a name, product and follow-up date. Mark each one relevant or not.','You can only follow up what has been written down. This shows whether the habit is working and whether the enquiries are worth chasing.'],['Enquiries that become orders','How many followed-up enquiries went on to place an order.','In the record, mark each follow-up as ordered, still interested or closed. At day 30, count the orders and compare with the number of relevant enquiries.','This shows whether following up actually brings in business. Some sales are slow, so note the ones still open.'],['Staff time spent following up','How much time staff spend recording enquiries and contacting people.','Ask the person responsible to note roughly how many minutes a day this takes, and add it up each week.','The routine only lasts if the time it takes is manageable for a small team.'],['Spending compared with business earned','Money spent on any tool or paid plan compared with money earned from orders that came after a follow-up.','Write down anything you pay (it may be nothing if you use WhatsApp and Excel). At day 30, note the value of orders that came after a follow-up. Compare the two in plain terms, including staff time.','It shows whether the habit pays for itself before you consider a paid tool.']],
 decide:{go:['Follow-ups are happening on the planned dates and some lead to orders.','The routine is manageable for staff.'],adj:['Staff find the record a burden: simplify it to fewer columns.','Consider a paid tool only if the simple record clearly is not enough.'],stop:['Few follow-ups happen, or few lead to orders, after a fair try. Long sales cycles may need more than 30 days.']},
 snap:'Before you start, take your last 10 enquiries from people who did not buy straight away. Write down how many were contacted again, how many became orders, and roughly how much staff time that took. A rough, honest estimate is fine.',

o:{name:'Order Management',blurb:'Keep orders, stock and status clear across every channel.',

 Q('Where do your orders come from?','',['Mostly the store and WhatsApp; also the website and phone calls'],['Mostly the store',{frag:-1}],['Evenly spread across store, website, WhatsApp and phone']),

 Q('Which improvement would help most?','',['All orders in one system, with current stock and a clear status'],['Orders from WhatsApp and the website arriving automatically',{},'sync'],['Something simple my team learns fast',{},'simple'])],

/* ===== Screens ===== */
function render(){const j=J[S.j],s=S.scr,A=$('#app');let h='';
 if(s==='welcome')h=`<div style="padding:40px 0 10px"><span class="tag">Prototype</span><h1>Find the right digital tool for how your business really works.</h1><p class="mute" style="font-size:1.05rem">You don't need to know what technology you need. Tell us how things work today and answer a few easy questions.</p></div>${nav(true,'Get started',true)}`;
 else if(s==='how')h=`<h2>How this works</h2><div class="steps"><div class="st"><b>1</b><span>Answer ten short questions about one area of your work.</span></div><div class="st"><b>2</b><span>We spot your biggest opportunity, then compare three tools that suit it.</span></div><div class="st"><b>3</b><span>See how work could change, what it may cost and how to try it safely.</span></div></div><div class="note">This is a design prototype. It uses fixed, explainable rules and example ratings, not AI or live data, and it does not connect to any of your software.</div>${nav()}`;
 else if(s==='desc')h=`<h2>Tell us about your business <span class="mute">(optional)</span></h2><p class="mute">A line or two is plenty. It is only kept on this page to give context. It is not analysed, and you can skip it.</p><textarea style="width:100%;min-height:110px;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)" oninput="S.desc=this.value">${S.desc.replace(/</g,'&lt;')}</textarea>${nav(true,'Continue')}`;
 else if(s==='area')h=`<h2>What would you like help with?</h2>${Object.entries(J).map(([k,v])=>`<button class="opt ${S.j===k?'on':''}" onclick="pick('${k}')"><b>${v.name}</b><br><span class="mute">${v.blurb}</span></button>`).join('')}${nav(false,'',false)}`;
 else if(s==='q'){const q=j.qs[S.q];h=`<span class="tag">${j.name} · Question ${S.q+1} of 10</span>${prog((S.q+1)*5)}<div class="note" style="margin-top:0">${j.src}</div><h2>${q.q}</h2>${q.o.map((o,i)=>`<button class="opt ${S.a[S.q]===i?'on':''}" aria-pressed="${S.a[S.q]===i}" onclick="ans(${i})">${o.t}</button>`).join('')}${nav(S.a[S.q]!=null,S.q<9?'Continue':'See my report')}`}
 else h=result(s);
 A.innerHTML=h}

function result(s){const j=J[S.j],{list:O,log}=opps(),top=O[0],T=tools(top),R=T.top,P=play(j,top),k=RS.indexOf(s),p=Math.round((k+1)/7*100),cr=crit(top.id);
 const alts=T.r.filter(t=>t!==R),erpY=S.j==='o'&&S.erp==='y',W=erpY?'your existing ERP':R.n,nm=id=>j.opps.find(o=>o.id===id).n;
 const head=t=>`<span class="tag">${j.name} · ${k+1} of 7</span>${prog(p)}<h2>${t}</h2>`;
 const hint=`<div class="note">${S.j==='e'?'<b>Illustrative only:</b> the employee-management answers and tool ratings are examples, not verified research. ':''}Ratings are preliminary prototype estimates, not measured results. Confirm details with each provider.</div>`;
 const pill=st=>`<span class="tag"${st==='no'?' style="background:var(--warn);color:var(--ink)"':''}>${ST[st]}</span>`;
 const cks=t=>t.ck.length?`<table><tr><th>Your need</th><th>Check</th></tr>${t.ck.map(c=>`<tr><td>${REQ[c[0]]}</td><td>${pill(c[1])}</td></tr>`).join('')}</table>`:'';
 if(s==='r0'){const sec=O[1],fam=id=>['outreach','follow','track'].includes(id);
  return head('Your Business Discovery Report')+`${S.j==='e'?`<div class="note">${j.src}</div>`:''}
 <div class="card"><h3>Your main opportunity</h3><p><b>${top.n}</b> · score ${f2(top.s)} out of 5</p><p>${top.goal}</p><h3 style="margin-top:12px">Why we identified it</h3><p>${top.why}</p>
 ${top.ch.length?`<p class="mute">Your answers changed this problem's ratings:</p>${top.ch.map(l=>`<p>• Question ${l.qi+1}, “${l.t}”: ${l.v>0?'raised':'lowered'} ${DIM[l.d]} by ${Math.abs(l.v)}.</p>`).join('')}`:'<p class="mute">Your answers did not change this problem\'s starting ratings.</p>'}
 ${top.cap.length?`<p class="mute">${top.cap.join(', ')} stayed at the 1–5 limit.</p>`:''}
 ${S.j==='m'&&fam(sec.id)!==fam(top.id)&&sec.s>=top.s-.5?`<div class="note">Close behind: <b>${sec.n}</b> (${f2(sec.s)}). It needs a different kind of fix, so look at it next.</div>`:''}</div>
 <div class="card"><h3>All opportunities, ranked</h3>${O.map(o=>`<div class="row"><span class="n">${o.n}${o.ch.length?' <span class="tag">changed by your answers</span>':''}</span><span class="m"><i style="width:${o.s*20}%"></i></span><span class="sc">${f2(o.s)}</span></div>`).join('')}
 <details><summary>How is the score worked out?</summary><p class="mute">Each problem is rated 1–5 for Frequency, Time and effort, Business impact and Digitalisation gap (how poorly today's setup supports the work). Score = (F + T + B + D) ÷ 4. Your answers move ratings only by fixed rules, listed below, and never outside 1–5. These are illustrative judgements, not measured data.</p><table><tr><th>Problem</th><th>F</th><th>T</th><th>B</th><th>D</th><th>Was</th></tr>${O.map(o=>`<tr><td>${o.n}</td><td>${o.F}</td><td>${o.T}</td><td>${o.B}</td><td>${o.D}</td><td>${f2(o.base)}</td></tr>`).join('')}</table></details>
 <details><summary>Which answers changed the result?</summary>${log.length?log.map(l=>`<p>• Question ${l.qi+1}, “${l.t}”: ${l.v>0?'raised':'lowered'} ${DIM[l.d]} by ${Math.abs(l.v)} for ${nm(l.id)}.</p>`).join(''):'<p>None. These are the starting ratings.</p>'}</details>
 <details><summary>Your answers</summary><table>${j.qs.map((q,i)=>S.a[i]!=null?`<tr><td>${i+1}. ${q.q}</td><td>${q.o[S.a[i]].t}${S.j==='e'?' <span class="mute">(example)</span>':S.a[i]===0?' <span class="mute">(documented)</span>':''}</td></tr>`:'').join('')}</table></details></div>`+nav()}
 if(s==='r1')return head('Compare three tools')+hint+`<p class="mute">Compared for your main problem: ${top.n.toLowerCase()}. Only tools rated for it are shown, listed from highest to lowest fit score. The scores are inside each “See the score and breakdown” section.</p>`+T.r.map((t,i)=>{const X=TX[t.n]||{};return `<div class="card"><h3>${i+1}. ${t.n}</h3><p class="mute">${t.what}</p><p>${X.need||''}</p><p>${X.team||''}</p>${t.ck.length?`<p style="margin-top:8px">${t.ck.map(c=>pill(c[1])).join(' ')}</p>`:''}
 <details ${S.open===t.n?'open':''}><summary>See the score and breakdown</summary><p><b>Fit score: ${f2(t.s)} / 5</b></p><table><tr><th>Criterion</th><th>Weight</th><th>Rating</th></tr>${[[cr,'imp',40],['Ease of use','ease',25],['Workflow fit','wf',20],['Staffing fit','staff',15]].map(c=>`<tr><td>${c[0]}</td><td>${c[2]}%</td><td>${t[c[1]]} / 5</td></tr>`).join('')}</table><p class="mute">Fit = (${cr} × 0.40) + (Ease × 0.25) + (Workflow × 0.20) + (Staffing × 0.15) = ${f2(t.s)}</p>${cks(t)}<p>${t.why}</p><p class="mute"><b>Limit:</b> ${t.limit}</p></details></div>`}).join('')+nav();
 if(s==='r2'){const bad=T.r[0].ck.filter(c=>c[1]==='no').map(c=>REQ[c[0]]),ver=R.ck.filter(c=>c[1]==='maybe'),X=TX[R.n]||{};
  const erp=S.j==='o'?`<div class="card hl"><span class="tag">Step 1 · Check your existing ERP first</span><h3 style="margin-top:8px">Can your existing ERP already ${ERPQ[top.id]}?</h3><p>Your team already uses it, so using more of it avoids a second system, extra training and one more place to enter the same order. We have no information about what your ERP can do, so we do not score it.</p><p class="mute"><b>A simple check:</b> take one real WhatsApp order and ask whoever supports the ERP to show you, step by step, how to record it, see current stock and mark its status. If any step cannot be done, answer “Partly or not sure” or “No”.</p><div class="tog">${[['y','Yes, confirmed'],['p','Partly or not sure'],['n','No']].map(x=>`<button class="btn ${S.erp===x[0]?'':'g'}" aria-pressed="${S.erp===x[0]}" onclick="S.erp='${x[0]}';render()">${x[1]}</button>`).join('')}</div><p>${S.erp==='y'?'Use your ERP first. A new tool is not needed unless a trial shows gaps.':S.erp?'Then a new tool may be worth testing. The best match is below.':'Answer this before choosing a new tool.'}</p></div>`:'';
  const tag=T.none?'Closest match':erpY?'Backup option':S.j==='o'?(S.erp?'Worth testing':'Possible option after the ERP check'):'Explore first';
  return head('Our preliminary recommendation')+hint+erp+(erpY?'<h3>If your ERP falls short</h3>':'')+`<div class="card ${erpY?'':'hl'}"><span class="tag">${tag}</span><h2 style="margin-top:8px">${R.n}</h2><p class="mute">${R.what}</p>
 <h3>The main problem</h3><p>${SC[S.j]}</p><p>From your answers, our rules point to <b>${top.n.toLowerCase()}</b>: ${top.why}</p><p><b>What would help:</b> ${top.goal}</p>
 <h3>Why ${R.n} suits this business</h3><p><b>Your need.</b> ${X.need||R.why}</p><p><b>Your current way of working.</b> ${X.flow||''}</p><p><b>Your team.</b> ${X.team||''}</p>
 <h3>A practical example</h3><div class="note ex"><b>Hypothetical example, not a result.</b> ${X.ex||''}</div>
 <h3>Limits and what to verify</h3><p>${R.limit}</p>${ver.map(c=>`<p>• Confirm ${REQ[c[0]]}. We cannot confirm it.</p>`).join('')}<p>• Check current prices, plan limits and features with the provider.</p>${cks(R)}
 <h3>When an alternative might be better</h3><p>${X.alt||''}</p></div>
 ${T.switched?`<div class="note">${T.r[0].n} scores higher, but does not meet your need for ${bad.join(', ')}. We recommend ${R.n} instead.</div>`:''}
 ${T.none?`<div class="note">No option fully meets your stated needs. ${R.n} is the closest, but check the items marked “Does not meet”.</div>`:''}
 ${T.reqs.includes('sync')?'<div class="note">You asked for automatic syncing between channels. We cannot confirm that any option does this. Ask for a demo with your own channels before relying on it.</div>':''}
 <h3>Alternatives</h3>${alts.map(t=>`<div class="card"><b>${t.n}</b><p class="mute">${t.what}</p><p>${t.why}</p>${t.ck.length?`<p>${t.ck.map(c=>pill(c[1])).join(' ')}</p>`:''}</div>`).join('')}
 <div class="card"><details style="border-top:0;margin:0;padding:0"><summary>Scores and how they were worked out</summary><p class="mute">Ratings are illustrative prototype estimates, not measured results. They rank the tools. The explanation above is what should guide your decision.</p><h3>Main problem</h3><p class="mute">Score = (F + T + B + D) ÷ 4 = (${top.F} + ${top.T} + ${top.B} + ${top.D}) ÷ 4 = ${f2(top.s)}</p><h3>Tool fit</h3><p class="mute">Fit = (${cr} × 0.40) + (Ease × 0.25) + (Workflow × 0.20) + (Staffing × 0.15)</p>${T.r.map(t=>`<div class="row" style="margin-top:14px"><span class="n"><b>${t.n}</b></span><span class="sc">${f2(t.s)} / 5</span></div><table><tr><th>Criterion</th><th>Weight</th><th>Rating</th></tr>${[[cr,'imp',40],['Ease of use','ease',25],['Workflow fit','wf',20],['Staffing fit','staff',15]].map(c=>`<tr><td>${c[0]}</td><td>${c[2]}%</td><td>${t[c[1]]} / 5</td></tr>`).join('')}</table>`).join('')}<p class="mute" style="margin-top:12px">${edge(R,T,cr)}</p></details></div>`+nav()}
 if(s==='r3'){const F=FLOW[S.j==='m'?P.k:S.j],fut=F.future(W);return head('How work could change')+`<p class="mute">Compare the two flows. Shaded steps are the ones that change. The people are the same; what differs is how the work is recorded and checked.</p><div class="flows"><section class="flow today" aria-label="Today, existing workflow"><div class="fh"><b>TODAY</b><h3>Existing workflow</h3></div><ol class="fl">${F.today.map(x=>`<li class="fs">${x}</li>`).join('')}</ol></section><section class="flow future" aria-label="With ${W}, proposed workflow"><div class="fh"><b>WITH ${W.toUpperCase()}</b><h3>Proposed workflow</h3></div><ol class="fl">${fut.map(x=>`<li class="fs${x[1]?' chg':''}">${x[0]}${x[1]?'<span class="vh"> (this step changes)</span>':''}</li>`).join('')}</ol></section></div>
 <div class="card"><h3>What actually changes</h3>${F.diff.map(x=>`<p>• ${x}</p>`).join('')}</div>${j.seq?`<p class="mute">Order status you would aim to track:</p><div class="seq">${j.seq.map(x=>`<span>${x}</span>`).join('<span style="background:none">→</span>')}</div>`:''}<div class="note">${F.caveat}</div><p class="mute">These are expected workflow benefits, not guaranteed results. Nothing here assumes your channels or software connect automatically: staff do the steps shown. Actual results must be assessed after trying it.</p>`+nav()}
 if(s==='r4'){const done=P.pilot.filter((_,i)=>S.chk[P.k+'p'+i]).length,D=P.decide,bl=(t,a)=>`<p style="margin-top:10px"><b>${t}</b></p>${a.map(x=>`<p>• ${x}</p>`).join('')}`;return head('Cost and a 30-day pilot')+`<div class="card"><h3>${P.costT}</h3>${P.costI.map(x=>`<p>• ${x}</p>`).join('')}${T.reqs.includes('lowcost')?'<p>• You want to spend little: start only with free or existing options and do not buy a paid plan until the pilot shows value.</p>':''}<p class="mute">Always confirm current prices directly with the provider.</p></div>
 <div class="card"><h3>How to compare before and after</h3><p class="mute">A proposed 30-day trial, not a promise of results. ${S.j==='e'?'This is an illustrative example scenario. ':''}You only need a pen, a sheet of paper or a simple spreadsheet.</p><div class="steps" style="margin-top:10px"><div class="st"><b>1</b><span><b>Before you start.</b> ${P.snap}</span></div><div class="st"><b>2</b><span><b>During the 30 days.</b> Repeat the same checks, the same way, once a week, ideally by the same person. Keep the method the same so the comparison is fair.</span></div><div class="st"><b>3</b><span><b>At day 30.</b> For each measure below, put the “before” and “after” answers side by side and mark it Better, About the same or Worse. Note anything unusual, such as a festival rush, that could explain a difference.</span></div></div></div>
 <div class="card"><h3>What to measure</h3><p class="mute">Tick each measure once you have agreed how you will check it (${done} of ${P.pilot.length}).</p>${P.pilot.map((m,i)=>`<label class="chk"><input type="checkbox" ${S.chk[P.k+'p'+i]?'checked':''} onchange="chk('${P.k}p${i}')"><span><b>${m[0]}</b><span class="ln"><b>What to check:</b> ${m[1]}</span><span class="ln"><b>How to check it:</b> ${m[2]}</span><span class="ln"><b>Why it matters:</b> ${m[3]}</span></span></label>`).join('')}</div>
 <div class="card"><h3>After 30 days: continue, adjust or stop?</h3><p class="mute">Look at the pattern across all the measures, not one number. Where results are mixed, adjust first and test again briefly before deciding.</p>${bl('Continue if',D.go)}${bl('Adjust if',D.adj)}${bl('Stop or rethink if',D.stop)}</div>`+nav()}
 if(s==='r5'){const done=P.steps.filter((_,i)=>S.chk[P.k+'s'+i]).length;return head('Getting started with '+W)+`<p class="mute">Keep your current way of working and add one small change. ${done} of ${P.steps.length} steps done.</p>`+P.steps.map((m,i)=>`<label class="chk"><input type="checkbox" ${S.chk[P.k+'s'+i]?'checked':''} onchange="chk('${P.k}s${i}')"><span><b>Step ${i+1} · ${m[0]}</b><br><span class="mute">${m[1]}</span></span></label>`).join('')+nav()}
 if(s==='r6'){const pn=P.pilot.length,a1=alts[0],a2=alts[1];return head('Your decision')+`<div class="three"><button class="big" onclick="S.dec='x';render()"><b>Explore ${W}</b><br><span class="mute">Start with a small, safe trial.</span></button><button class="big" onclick="S.open='${a1.n}';go('r1')"><b>Compare another option</b><br><span class="mute">Look at ${a1.n} and ${a2.n}.</span></button><button class="big" onclick="go('r4')"><b>Understand cost and benefits first</b><br><span class="mute">Cost checks and pilot measures.</span></button></div>
 ${S.dec==='x'?`<div class="card" style="border-color:var(--pri)"><h3>Your next move</h3><p>${P.steps[0][0]}: ${P.steps[0][1]}</p><p class="mute">Then run the ${pn}-measure pilot. Review the evidence before spending money or widening use.</p>${P.link&&R.n==='IndiaMART'?`<a class="btn s" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="${P.link[1]}">${P.link[0]}</a>`:'<p class="mute">Search for the provider\'s official site and confirm current plans and prices.</p>'}</div>`:''}
 <div class="card"><p><b>Start small, measure the results and expand only when the evidence supports it.</b></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g s" onclick="go('area')">Try another area</button><button class="btn g s" onclick="restart()">Restart</button></div></div>`+nav(true,'',false)}}
const $=s=>document.querySelector(s);render();
</script></body></html>
